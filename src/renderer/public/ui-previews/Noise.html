  top: 0;

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading Noise...</div></div>
<script type="module">
import * as React from 'react';
import { useRef, useEffect } from 'react';
const Noise = ({ patternSize = 250, patternScaleX = 1, patternScaleY = 1, patternRefreshInterval = 2, patternAlpha = 15 }) => {
    const grainRef = useRef(null);
    useEffect(() => {
        const canvas = grainRef.current;
        if (!canvas)
            return;
        const ctx = canvas.getContext('2d', { alpha: true });
        if (!ctx)
            return;
        let frame = 0;
        let animationId;
        const canvasSize = 1024;
        const resize = () => {
            if (!canvas)
                return;
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
        };
        const drawGrain = () => {
            const imageData = ctx.createImageData(canvasSize, canvasSize);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 255;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = patternAlpha;
            }
            ctx.putImageData(imageData, 0, 0);
        };
        const loop = () => {
            if (frame % patternRefreshInterval === 0) {
                drawGrain();
            }
            frame++;
            animationId = window.requestAnimationFrame(loop);
        };
        window.addEventListener('resize', resize);
        resize();
        loop();
        return () => {
            window.removeEventListener('resize', resize);
            window.cancelAnimationFrame(animationId);
        };
    }, [patternSize, patternScaleX, patternScaleY, patternRefreshInterval, patternAlpha]);
    return React.createElement("canvas", { className: "noise-overlay", ref: grainRef, style: { imageRendering: 'pixelated' } });
};
Noise;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(Noise, {
    patternSize: 250,
    patternScaleX: 2,
    patternScaleY: 2,
    patternAlpha: 15
}));

</script>
</body>
</html>
