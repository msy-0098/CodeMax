<script type="module">
import * as React from 'react';
import { useRef, useEffect, useCallback, useMemo } from 'react';
import { gsap } from 'gsap';

                        inertia: { xOffset: pushX, yOffset: pushY, resistance },
                        onComplete: () => {
                            gsap.to(dot, {
                                xOffset: 0,
                                yOffset: 0,
                                duration: returnDuration,

};

createRoot(document.getElementById('root')).render(React.createElement(DotGrid, {
    dotSize: 5,
    gap: 15,
    baseColor: '#2F293A',
    activeColor: '#5227FF',
    proximity: 120,
    shockRadius: 250,
    shockStrength: 5,
    resistance: 750,
    returnDuration: 1.5
}));

</script>
