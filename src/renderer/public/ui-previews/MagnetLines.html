<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagnetLines Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{width:100vw;height:100vh}
.magnetLines-container {
  display: grid;
  grid-template-columns: repeat(var(--columns), 1fr);
  grid-template-rows: repeat(var(--rows), 1fr);

  justify-items: center;
  align-items: center;

  width: 80vmin;
  height: 80vmin;
}

.magnetLines-container span {
  display: block;
  transform-origin: center;
  will-change: transform;
  transform: rotate(var(--rotate));
}

</style>

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading MagnetLines...</div></div>
<script type="module">
import * as React from 'react';
import { useRef, useEffect } from 'react';
function MagnetLines({ rows = 9, columns = 9, containerSize = '80vmin', lineColor = '#efefef', lineWidth = '1vmin', lineHeight = '6vmin', baseAngle = -10, className = '', style = {} }) {
    const containerRef = useRef(null);
    useEffect(() => {
        const container = containerRef.current;
        if (!container)
            return;
        const items = container.querySelectorAll('span');
        const onPointerMove = pointer => {
            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                const centerX = rect.x + rect.width / 2;
                const centerY = rect.y + rect.height / 2;
                const b = pointer.x - centerX;
                const a = pointer.y - centerY;
                const c = Math.sqrt(a * a + b * b) || 1;
                const r = ((Math.acos(b / c) * 180) / Math.PI) * (pointer.y > centerY ? 1 : -1);
                item.style.setProperty('--rotate', `${r}deg`);
            });
        };
        window.addEventListener('pointermove', onPointerMove);
        if (items.length) {
            const middleIndex = Math.floor(items.length / 2);
            const rect = items[middleIndex].getBoundingClientRect();
            onPointerMove({ x: rect.x, y: rect.y });
        }
        return () => {
            window.removeEventListener('pointermove', onPointerMove);
        };
    }, [rows, columns]);
    const total = rows * columns;
    const spans = Array.from({ length: total }, (_, i) => (React.createElement("span", { key: i, style: {
            '--rotate': `${baseAngle}deg`,
            backgroundColor: lineColor,
            width: lineWidth,
            height: lineHeight
        } })));
    return (React.createElement("div", { ref: containerRef, className: `magnetLines-container ${className}`, style: {
            display: 'grid',
            gridTemplateColumns: `repeat(${columns}, 1fr)`,
            gridTemplateRows: `repeat(${rows}, 1fr)`,
            width: containerSize,
            height: containerSize,
            ...style
        } }, spans));
}
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(MagnetLines, {
    rows: 10,
    columns: 12,
    containerSize: '40vmin',
    lineWidth: '2px',
    lineHeight: '30px',
    baseAngle: -10,
    lineColor: '#efefef'
}));

</script>
</body>
