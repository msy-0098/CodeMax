body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

  height: 100%;
  position: relative;

<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.0.0","react/jsx-runtime":"https://esm.sh/react@19.0.0/jsx-runtime","react-dom":"https://esm.sh/react-dom@19.0.0","react-dom/client":"https://esm.sh/react-dom@19.0.0/client","motion/react":"https://esm.sh/motion@12.23.12/react?external=react,react-dom","gsap":"https://esm.sh/gsap@3.13.0","gsap/":"https://esm.sh/gsap@3.13.0/","@gsap/react":"https://esm.sh/@gsap/react@2.1.2?external=gsap,react","ogl":"https://esm.sh/ogl@1.0.11","three":"https://esm.sh/three@0.180.0","three/":"https://esm.sh/three@0.180.0/","@react-three/fiber":"https://esm.sh/@react-three/fiber@9.3.0?external=react,react-dom,three","@react-three/drei":"https://esm.sh/@react-three/drei@10.7.4?external=react,three,@react-three/fiber","@react-three/postprocessing":"https://esm.sh/@react-three/postprocessing@3.0.4?external=react,three,@react-three/fiber,postprocessing","@react-three/rapier":"https://esm.sh/@react-three/rapier@2.1.0?external=react,three,@react-three/fiber","postprocessing":"https://esm.sh/postprocessing@6.36.0?external=three","matter-js":"https://esm.sh/matter-js@0.20.0","react-icons/":"https://esm.sh/react-icons@5.5.0/","lucide-react":"https://esm.sh/lucide-react@0.542.0?external=react","lenis":"https://esm.sh/lenis@1.3.13","meshline":"https://esm.sh/meshline@3.3.1?external=three","gl-matrix":"https://esm.sh/gl-matrix@3.4.3","maath":"https://esm.sh/maath@0.10.8?external=three","@use-gesture/react":"https://esm.sh/@use-gesture/react@10.2.27?external=react","face-api.js":"https://esm.sh/face-api.js@0.22.2"}}</script>

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading Ribbons...</div></div>
<script type="module">
import * as React from 'react';
import { useEffect, useRef } from 'react';
import { Renderer, Transform, Vec3, Color, Polyline } from 'ogl';
const Ribbons = ({ colors = ['#FC8EAC'], baseSpring = 0.03, baseFriction = 0.9, baseThickness = 30, offsetFactor = 0.05, maxAge = 500, pointCount = 50, speedMultiplier = 0.6, enableFade = false, enableShaderEffect = false, effectAmplitude = 2, backgroundColor = [0, 0, 0, 0] }) => {
    const containerRef = useRef(null);
    useEffect(() => {
        const container = containerRef.current;
        if (!container)
            return;
        const renderer = new Renderer({ dpr: window.devicePixelRatio || 2, alpha: true });
        const gl = renderer.gl;
        if (Array.isArray(backgroundColor) && backgroundColor.length === 4) {
            gl.clearColor(backgroundColor[0], backgroundColor[1], backgroundColor[2], backgroundColor[3]);
        }
        else {
            gl.clearColor(0, 0, 0, 0);
        }
        gl.canvas.style.position = 'absolute';
        gl.canvas.style.top = '0';
        gl.canvas.style.left = '0';
        gl.canvas.style.width = '100%';
        gl.canvas.style.height = '100%';
        container.appendChild(gl.canvas);
        const scene = new Transform();
        const lines = [];
        const vertex = `
      precision highp float;
      
      attribute vec3 position;
      attribute vec3 next;
      attribute vec3 prev;
      attribute vec2 uv;
      attribute float side;
      
      uniform vec2 uResolution;
      uniform float uDPR;
      uniform float uThickness;
      uniform float uTime;
      uniform float uEnableShaderEffect;
      uniform float uEffectAmplitude;
      
      varying vec2 vUV;
      
      vec4 getPosition() {
          vec4 current = vec4(position, 1.0);
          vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);
          vec2 nextScreen = next.xy * aspect;
          vec2 prevScreen = prev.xy * aspect;
          vec2 tangent = normalize(nextScreen - prevScreen);
          vec2 normal = vec2(-tangent.y, tangent.x);
          normal /= aspect;
          normal *= mix(1.0, 0.1, pow(abs(uv.y - 0.5) * 2.0, 2.0));
          float dist = length(nextScreen - prevScreen);
          normal *= smoothstep(0.0, 0.02, dist);
          float pixelWidthRatio = 1.0 / (uResolution.y / uDPR);
          float pixelWidth = current.w * pixelWidthRatio;
          normal *= pixelWidth * uThickness;
          current.xy -= normal * side;
          if(uEnableShaderEffect > 0.5) {
            current.xy += normal * sin(uTime + current.x * 10.0) * uEffectAmplitude;
          }
          return current;
      }
      
      void main() {
          vUV = uv;
          gl_Position = getPosition();
      }
    `;
        const fragment = `
      precision highp float;
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uEnableFade;
      varying vec2 vUV;
      void main() {
          float fadeFactor = 1.0;
          if(uEnableFade > 0.5) {
              fadeFactor = 1.0 - smoothstep(0.0, 1.0, vUV.y);
          }
          gl_FragColor = vec4(uColor, uOpacity * fadeFactor);
      }
    `;
        function resize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            lines.forEach(line => line.polyline.resize());
        }
        window.addEventListener('resize', resize);
        const center = (colors.length - 1) / 2;
        colors.forEach((color, index) => {
            const spring = baseSpring + (Math.random() - 0.5) * 0.05;
            const friction = baseFriction + (Math.random() - 0.5) * 0.05;
            const thickness = baseThickness + (Math.random() - 0.5) * 3;
            const mouseOffset = new Vec3((index - center) * offsetFactor + (Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.1, 0);
            const line = {
                spring,
                friction,
                mouseVelocity: new Vec3(),
                mouseOffset
            };
            const count = pointCount;
            const points = [];
            for (let i = 0; i < count; i++) {
                points.push(new Vec3());
            }
            line.points = points;
            line.polyline = new Polyline(gl, {
                points,
                vertex,
                fragment,
                uniforms: {
                    uColor: { value: new Color(color) },
                    uThickness: { value: thickness },
                    uOpacity: { value: 1.0 },
                    uTime: { value: 0.0 },
                    uEnableShaderEffect: { value: enableShaderEffect ? 1.0 : 0.0 },
                    uEffectAmplitude: { value: effectAmplitude },
                    uEnableFade: { value: enableFade ? 1.0 : 0.0 }
                }
            });
            line.polyline.mesh.setParent(scene);
            lines.push(line);
        });
        resize();
        const mouse = new Vec3();
        function updateMouse(e) {
            let x, y;
            const rect = container.getBoundingClientRect();
            if (e.changedTouches && e.changedTouches.length) {
                x = e.changedTouches[0].clientX - rect.left;
                y = e.changedTouches[0].clientY - rect.top;
            }
            else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }
            const width = container.clientWidth;
            const height = container.clientHeight;
            mouse.set((x / width) * 2 - 1, (y / height) * -2 + 1, 0);
        }
        container.addEventListener('mousemove', updateMouse);
        container.addEventListener('touchstart', updateMouse);
        container.addEventListener('touchmove', updateMouse);
        const tmp = new Vec3();
        let frameId;
        let lastTime = performance.now();
        function update() {
            frameId = requestAnimationFrame(update);
            const currentTime = performance.now();
            const dt = currentTime - lastTime;
            lastTime = currentTime;
            lines.forEach(line => {
                tmp.copy(mouse).add(line.mouseOffset).sub(line.points[0]).multiply(line.spring);
                line.mouseVelocity.add(tmp).multiply(line.friction);
                line.points[0].add(line.mouseVelocity);
                for (let i = 1; i < line.points.length; i++) {
                    if (isFinite(maxAge) && maxAge > 0) {
                        const segmentDelay = maxAge / (line.points.length - 1);
                        const alpha = Math.min(1, (dt * speedMultiplier) / segmentDelay);
                        line.points[i].lerp(line.points[i - 1], alpha);
                    }
                    else {
                        line.points[i].lerp(line.points[i - 1], 0.9);
                    }
                }
                if (line.polyline.mesh.program.uniforms.uTime) {
                    line.polyline.mesh.program.uniforms.uTime.value = currentTime * 0.001;
                }
                line.polyline.updateGeometry();
            });
            renderer.render({ scene });
        }
        update();
        return () => {
            window.removeEventListener('resize', resize);
            container.removeEventListener('mousemove', updateMouse);
            container.removeEventListener('touchstart', updateMouse);
            container.removeEventListener('touchmove', updateMouse);
            cancelAnimationFrame(frameId);
            if (gl.canvas && gl.canvas.parentNode === container) {
                container.removeChild(gl.canvas);
            }
        };
    }, [
        colors,
        baseSpring,
        baseFriction,
        baseThickness,
        offsetFactor,
        maxAge,
        pointCount,
        speedMultiplier,
        enableFade,
        enableShaderEffect,
        effectAmplitude,
        backgroundColor
    ]);
    return React.createElement("div", { ref: containerRef, className: "ribbons-container" });
};
Ribbons;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(Ribbons, {
    baseThickness: 30,
    colors: ['#5227FF'],
    speedMultiplier: 0.5,
    maxAge: 500,
    enableFade: false,
    enableShaderEffect: false
}));

</script>
</body>
