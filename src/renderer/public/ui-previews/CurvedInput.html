<title>CurvedInput Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.curved-input {
  position: relative;
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 0;
}

.curved-input__svg {
  display: block;
  overflow: visible;
  width: 100%;
  height: auto;
  cursor: text;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.curved-input__svg text {
  font-family: inherit;
}

.curved-input__ring {
  opacity: 0;
  transition: opacity 0.25s ease;
}

.curved-input--focused .curved-input__ring {
  opacity: 0.28;
}

.curved-input__button {
  cursor: pointer;
  outline: none;
}

.curved-input__button-bg {
  transition:
    filter 0.2s ease,
    opacity 0.2s ease;
}

.curved-input__button:hover .curved-input__button-bg {
  filter: brightness(1.12);
}

.curved-input__button:active .curved-input__button-bg {
  filter: brightness(0.94);
}

.curved-input__button:focus-visible .curved-input__button-bg {
  filter: brightness(1.18);
}

.curved-input__field {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  font-size: 16px;
  pointer-events: none;
  outline: none;
}

</style>
