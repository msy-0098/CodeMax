<html lang="en">

<title>GridDistortion Preview</title>

body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

  height: 100%;
  overflow: hidden;

<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.0.0","react/jsx-runtime":"https://esm.sh/react@19.0.0/jsx-runtime","react-dom":"https://esm.sh/react-dom@19.0.0","react-dom/client":"https://esm.sh/react-dom@19.0.0/client","motion/react":"https://esm.sh/motion@12.23.12/react?external=react,react-dom","gsap":"https://esm.sh/gsap@3.13.0","gsap/":"https://esm.sh/gsap@3.13.0/","@gsap/react":"https://esm.sh/@gsap/react@2.1.2?external=gsap,react","ogl":"https://esm.sh/ogl@1.0.11","three":"https://esm.sh/three@0.180.0","three/":"https://esm.sh/three@0.180.0/","@react-three/fiber":"https://esm.sh/@react-three/fiber@9.3.0?external=react,react-dom,three","@react-three/drei":"https://esm.sh/@react-three/drei@10.7.4?external=react,three,@react-three/fiber","@react-three/postprocessing":"https://esm.sh/@react-three/postprocessing@3.0.4?external=react,three,@react-three/fiber,postprocessing","@react-three/rapier":"https://esm.sh/@react-three/rapier@2.1.0?external=react,three,@react-three/fiber","postprocessing":"https://esm.sh/postprocessing@6.36.0?external=three","matter-js":"https://esm.sh/matter-js@0.20.0","react-icons/":"https://esm.sh/react-icons@5.5.0/","lucide-react":"https://esm.sh/lucide-react@0.542.0?external=react","lenis":"https://esm.sh/lenis@1.3.13","meshline":"https://esm.sh/meshline@3.3.1?external=three","gl-matrix":"https://esm.sh/gl-matrix@3.4.3","maath":"https://esm.sh/maath@0.10.8?external=three","@use-gesture/react":"https://esm.sh/@use-gesture/react@10.2.27?external=react","face-api.js":"https://esm.sh/face-api.js@0.22.2"}}</script>

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading GridDistortion...</div></div>
<script type="module">
import * as React from 'react';
import { useEffect, useRef } from 'react';
import * as THREE from 'three';
const vertexShader = `
uniform float time;
varying vec2 vUv;
varying vec3 vPosition;

void main() {
  vUv = uv;
  vPosition = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const fragmentShader = `
uniform sampler2D uDataTexture;
uniform sampler2D uTexture;
uniform vec4 resolution;
varying vec2 vUv;

void main() {
  vec2 uv = vUv;
  vec4 offset = texture2D(uDataTexture, vUv);
  gl_FragColor = texture2D(uTexture, uv - 0.02 * offset.rg);
}`;
const GridDistortion = ({ grid = 15, mouse = 0.1, strength = 0.15, relaxation = 0.9, imageSrc, className = '' }) => {
    const containerRef = useRef(null);
    const sceneRef = useRef(null);
    const rendererRef = useRef(null);
    const cameraRef = useRef(null);
    const planeRef = useRef(null);
    const imageAspectRef = useRef(1);
    const animationIdRef = useRef(null);
    const resizeObserverRef = useRef(null);
    useEffect(() => {
        if (!containerRef.current)
            return;
        const container = containerRef.current;
        const scene = new THREE.Scene();
        sceneRef.current = scene;
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        rendererRef.current = renderer;
        container.innerHTML = '';
        container.appendChild(renderer.domElement);
        const camera = new THREE.OrthographicCamera(0, 0, 0, 0, -1000, 1000);
        camera.position.z = 2;
        cameraRef.current = camera;
        const uniforms = {
            time: { value: 0 },
            resolution: { value: new THREE.Vector4() },
            uTexture: { value: null },
            uDataTexture: { value: null }
        };
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(imageSrc, texture => {
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            imageAspectRef.current = texture.image.width / texture.image.height;
            uniforms.uTexture.value = texture;
            handleResize();
        });
        const size = grid;
        const data = new Float32Array(4 * size * size);
        for (let i = 0; i < size * size; i++) {
            data[i * 4] = Math.random() * 255 - 125;
            data[i * 4 + 1] = Math.random() * 255 - 125;
        }
        const dataTexture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.FloatType);
        dataTexture.needsUpdate = true;
        uniforms.uDataTexture.value = dataTexture;
        const material = new THREE.ShaderMaterial({
            side: THREE.DoubleSide,
            uniforms,
            vertexShader,
            fragmentShader,
            transparent: true
        });
        const geometry = new THREE.PlaneGeometry(1, 1, size - 1, size - 1);
        const plane = new THREE.Mesh(geometry, material);
        planeRef.current = plane;
        scene.add(plane);
        const handleResize = () => {
            if (!container || !renderer || !camera)
                return;
            const rect = container.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            if (width === 0 || height === 0)
                return;
            const containerAspect = width / height;
            renderer.setSize(width, height);
            if (plane) {
                plane.scale.set(containerAspect, 1, 1);
            }
            const frustumHeight = 1;
            const frustumWidth = frustumHeight * containerAspect;
            camera.left = -frustumWidth / 2;
            camera.right = frustumWidth / 2;
            camera.top = frustumHeight / 2;
            camera.bottom = -frustumHeight / 2;
            camera.updateProjectionMatrix();
            uniforms.resolution.value.set(width, height, 1, 1);
        };
        if (window.ResizeObserver) {
            const resizeObserver = new ResizeObserver(() => {
                handleResize();
            });
            resizeObserver.observe(container);
            resizeObserverRef.current = resizeObserver;
        }
        else {
            window.addEventListener('resize', handleResize);
        }
        const mouseState = {
            x: 0,
            y: 0,
            prevX: 0,
            prevY: 0,
            vX: 0,
            vY: 0
        };
        const handleMouseMove = e => {
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = 1 - (e.clientY - rect.top) / rect.height;
            mouseState.vX = x - mouseState.prevX;
            mouseState.vY = y - mouseState.prevY;
            Object.assign(mouseState, { x, y, prevX: x, prevY: y });
        };
        const handleMouseLeave = () => {
            if (dataTexture) {
                dataTexture.needsUpdate = true;
            }
            Object.assign(mouseState, {
                x: 0,
                y: 0,
                prevX: 0,
                prevY: 0,
                vX: 0,
                vY: 0
            });
        };
        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);
        handleResize();
        const animate = () => {
            animationIdRef.current = requestAnimationFrame(animate);
            if (!renderer || !scene || !camera)
                return;
            uniforms.time.value += 0.05;
            const data = dataTexture.image.data;
            for (let i = 0; i < size * size; i++) {
                data[i * 4] *= relaxation;
                data[i * 4 + 1] *= relaxation;
            }
            const gridMouseX = size * mouseState.x;
            const gridMouseY = size * mouseState.y;
            const maxDist = size * mouse;
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    const distSq = Math.pow(gridMouseX - i, 2) + Math.pow(gridMouseY - j, 2);
                    if (distSq < maxDist * maxDist) {
                        const index = 4 * (i + size * j);
                        const power = Math.min(maxDist / Math.sqrt(distSq), 10);
                        data[index] += strength * 100 * mouseState.vX * power;
                        data[index + 1] -= strength * 100 * mouseState.vY * power;
                    }
                }
            }
            dataTexture.needsUpdate = true;
            renderer.render(scene, camera);
        };
        animate();
        return () => {
            if (animationIdRef.current) {
                cancelAnimationFrame(animationIdRef.current);
            }
            if (resizeObserverRef.current) {
                resizeObserverRef.current.disconnect();
            }
            else {
                window.removeEventListener('resize', handleResize);
            }
            container.removeEventListener('mousemove', handleMouseMove);
            container.removeEventListener('mouseleave', handleMouseLeave);
            if (renderer) {
                renderer.dispose();
                renderer.forceContextLoss();
                if (container.contains(renderer.domElement)) {
                    container.removeChild(renderer.domElement);
                }
            }
            if (geometry)
                geometry.dispose();
            if (material)
                material.dispose();
            if (dataTexture)
                dataTexture.dispose();
            if (uniforms.uTexture.value)
                uniforms.uTexture.value.dispose();
            sceneRef.current = null;
            rendererRef.current = null;
            cameraRef.current = null;
            planeRef.current = null;
        };
    }, [grid, mouse, strength, relaxation, imageSrc]);
    return (React.createElement("div", { ref: containerRef, className: `distortion-container ${className}`, style: {
            width: '100%',
            height: '100%',
            minWidth: '0',
            minHeight: '0'
        } }));
};
GridDistortion;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(GridDistortion, {
    grid: 10,
    mouse: 0.25
}));

</script>
</body>
