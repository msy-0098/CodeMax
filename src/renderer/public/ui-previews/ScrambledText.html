<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading ScrambledText...</div></div>
<script type="module">
import * as React from 'react';
import { useEffect, useRef } from 'react';
import { gsap } from 'gsap';
import { SplitText } from 'gsap/SplitText';
import { ScrambleTextPlugin } from 'gsap/ScrambleTextPlugin';
gsap.registerPlugin(SplitText, ScrambleTextPlugin);
const ScrambledText = ({ radius = 100, duration = 1.2, speed = 0.5, scrambleChars = '.:', className = '', style = {}, children }) => {
    const rootRef = useRef(null);
    const charsRef = useRef([]);
    useEffect(() => {
        if (!rootRef.current)
            return;
        const split = SplitText.create(rootRef.current.querySelector('p'), {
            type: 'chars',
            charsClass: 'char'
        });
        charsRef.current = split.chars;
        charsRef.current.forEach(c => {
            gsap.set(c, {
                display: 'inline-block',
                attr: { 'data-content': c.innerHTML }
            });
        });
        const handleMove = e => {
            charsRef.current.forEach(c => {
                const { left, top, width, height } = c.getBoundingClientRect();
                const dx = e.clientX - (left + width / 2);
                const dy = e.clientY - (top + height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist < radius) {
                    gsap.to(c, {
                        overwrite: true,
                        duration: duration * (1 - dist / radius),
                        scrambleText: {
                            text: c.dataset.content || '',
                            chars: scrambleChars,
                            speed
                        },
                        ease: 'none'
                    });
                }
            });
        };
        const el = rootRef.current;
        el.addEventListener('pointermove', handleMove);
        return () => {
            el.removeEventListener('pointermove', handleMove);
            split.revert();
        };
    }, [radius, duration, speed, scrambleChars]);
    return (React.createElement("div", { ref: rootRef, className: `text-block ${className}`, style: style },
        React.createElement("p", null, children)));
};
ScrambledText;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(ScrambledText, {
    radius: 100,
    duration: 1.2,
    speed: 0.5,
    scrambleChars: '.:'
}));

</script>
