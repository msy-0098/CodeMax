<title>FallingText Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.falling-text-container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  cursor: pointer;
  text-align: center;
  padding-top: 2em;
}

.falling-text-target {
  display: inline-block;
}

.word {
  display: inline-block;
  margin: 0 2px;
  user-select: none;
}

.highlighted {
  color: cyan;
  font-weight: bold;
}

.falling-text-canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 0;
}

</style>

<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading FallingText...</div></div>
<script type="module">
import * as React from 'react';
import { useRef, useState, useEffect } from 'react';
import Matter from 'matter-js';
const FallingText = ({ className = '', text = '', highlightWords = [], highlightClass = 'highlighted', trigger = 'auto', backgroundColor = 'transparent', wireframes = false, gravity = 1, mouseConstraintStiffness = 0.2, fontSize = '1rem' }) => {
    const containerRef = useRef(null);
    const textRef = useRef(null);
    const canvasContainerRef = useRef(null);
    const [effectStarted, setEffectStarted] = useState(false);
    useEffect(() => {
        if (!textRef.current)
            return;
        const words = text.split(' ');
        const newHTML = words
            .map(word => {
            const isHighlighted = highlightWords.some(hw => word.startsWith(hw));
            return `<span class="word ${isHighlighted ? highlightClass : ''}">${word}</span>`;
        })
            .join(' ');
        textRef.current.innerHTML = newHTML;
    }, [text, highlightWords, highlightClass]);
    useEffect(() => {
        if (trigger === 'auto') {
            setEffectStarted(true);
            return;
        }
        if (trigger === 'scroll' && containerRef.current) {
            const observer = new IntersectionObserver(([entry]) => {
                if (entry.isIntersecting) {
                    setEffectStarted(true);
                    observer.disconnect();
                }
            }, { threshold: 0.1 });
            observer.observe(containerRef.current);
            return () => observer.disconnect();
        }
    }, [trigger]);
    useEffect(() => {
        if (!effectStarted)
            return;
        const { Engine, Render, World, Bodies, Runner, Mouse, MouseConstraint } = Matter;
        const containerRect = containerRef.current.getBoundingClientRect();
        const width = containerRect.width;
        const height = containerRect.height;
        if (width <= 0 || height <= 0) {
            return;
        }
        const engine = Engine.create();
        engine.world.gravity.y = gravity;
        const render = Render.create({
            element: canvasContainerRef.current,
            engine,
            options: {
                width,
                height,
                background: backgroundColor,
                wireframes
            }
        });
        const boundaryOptions = {
            isStatic: true,
            render: { fillStyle: 'transparent' }
        };
        const floor = Bodies.rectangle(width / 2, height + 25, width, 50, boundaryOptions);
        const leftWall = Bodies.rectangle(-25, height / 2, 50, height, boundaryOptions);
        const rightWall = Bodies.rectangle(width + 25, height / 2, 50, height, boundaryOptions);
        const ceiling = Bodies.rectangle(width / 2, -25, width, 50, boundaryOptions);
        const wordSpans = textRef.current.querySelectorAll('.word');
        const wordBodies = [...wordSpans].map(elem => {
            const rect = elem.getBoundingClientRect();
            const x = rect.left - containerRect.left + rect.width / 2;
            const y = rect.top - containerRect.top + rect.height / 2;
            const body = Bodies.rectangle(x, y, rect.width, rect.height, {
                render: { fillStyle: 'transparent' },
                restitution: 0.8,
                frictionAir: 0.01,
                friction: 0.2
            });
            Matter.Body.setVelocity(body, {
                x: (Math.random() - 0.5) * 5,
                y: 0
            });
            Matter.Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.05);
            return { elem, body };
        });
        wordBodies.forEach(({ elem, body }) => {
            elem.style.position = 'absolute';
            elem.style.left = `${body.position.x - body.bounds.max.x + body.bounds.min.x / 2}px`;
            elem.style.top = `${body.position.y - body.bounds.max.y + body.bounds.min.y / 2}px`;
            elem.style.transform = 'none';
        });
        const mouse = Mouse.create(containerRef.current);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse,
            constraint: {
                stiffness: mouseConstraintStiffness,
                render: { visible: false }
            }
        });
        render.mouse = mouse;
        World.add(engine.world, [floor, leftWall, rightWall, ceiling, mouseConstraint, ...wordBodies.map(wb => wb.body)]);
        const runner = Runner.create();
        Runner.run(runner, engine);
        Render.run(render);
        const updateLoop = () => {
            wordBodies.forEach(({ body, elem }) => {
                const { x, y } = body.position;
                elem.style.left = `${x}px`;
                elem.style.top = `${y}px`;
                elem.style.transform = `translate(-50%, -50%) rotate(${body.angle}rad)`;
            });
            Matter.Engine.update(engine);
            requestAnimationFrame(updateLoop);
        };
        updateLoop();
        return () => {
            Render.stop(render);
            Runner.stop(runner);
            if (render.canvas && canvasContainerRef.current) {
                // eslint-disable-next-line react-hooks/exhaustive-deps
                canvasContainerRef.current.removeChild(render.canvas);
            }
            World.clear(engine.world);
            Engine.clear(engine);
        };
    }, [effectStarted, gravity, wireframes, backgroundColor, mouseConstraintStiffness]);
    const handleTrigger = () => {
        if (!effectStarted && (trigger === 'click' || trigger === 'hover')) {
            setEffectStarted(true);
        }
    };
    return (React.createElement("div", { ref: containerRef, className: `falling-text-container ${className}`, onClick: trigger === 'click' ? handleTrigger : undefined, onMouseEnter: trigger === 'hover' ? handleTrigger : undefined, style: {
            position: 'relative',
            overflow: 'hidden'
        } },
        React.createElement("div", { ref: textRef, className: "falling-text-target", style: {
                fontSize: fontSize,
                lineHeight: 1.4
            } }),
        React.createElement("div", { ref: canvasContainerRef, className: "falling-text-canvas" })));
};
FallingText;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(FallingText, {
    gravity: 0.56,
    mouseConstraintStiffness: 0.9,
    trigger: 'hover'
}));

</script>
