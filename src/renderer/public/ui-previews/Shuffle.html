<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuffle Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.shuffle-parent {
  display: inline-block;
  white-space: normal;
  word-wrap: break-word;
  will-change: transform;
  line-height: 1;
  font-size: 4rem;
  font-family: 'Press Start 2P', sans-serif;
  text-transform: uppercase;
  visibility: hidden;
}

.shuffle-parent.is-ready {
  visibility: visible;
}

.shuffle-char-wrapper {
  display: inline-block;
  overflow: hidden;
  vertical-align: baseline;
  position: relative;
}

.shuffle-char-wrapper > span {
  display: inline-flex;
  will-change: transform;
}

.shuffle-char {
  line-height: 1;
  display: inline-block;
  text-align: center;
}

</style>

<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading Shuffle...</div></div>
<script type="module">

                charsClass: 'shuffle-char',

            wrappersRef.current = [];

                    overflow: 'hidden',
                    width: w + 'px',

                    verticalAlign: 'bottom'

                    textAlign: 'center'

                }

                if (even.length)

                        duration,
                        ease,
                        force3D: true
                    };

                        vars.y = parseFloat(strip.getAttribute('data-final-y') || '0');
                    }
                    else {
                        vars.x = parseFloat(strip.getAttribute('data-final-x') || '0');
                    }

            }

        };

            if (!triggerOnHover || !ref.current)
                return;
            removeHover();

                if (playingRef.current)
                    return;
                build();
                if (scrambleCharset)
                    randomizeScrambles();

            };

            ref.current.addEventListener('mouseenter', handler);
        };

            build();
            if (scrambleCharset)
                randomizeScrambles();
            play();
            armHover();

            trigger: el,

        dependencies: [
            text,
            duration,
            maxDelay,
            ease,
            scrollTriggerStart,
            fontsLoaded,
            shuffleDirection,
            shuffleTimes,
            animationMode,
            loop,
            loopDelay,
            stagger,
            scrambleCharset,
            colorFrom,
            colorTo,

    loop: false,
    loopDelay: 0,
    triggerOnHover: true
}));

</script>
