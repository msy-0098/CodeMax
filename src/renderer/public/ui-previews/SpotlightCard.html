<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotlightCard Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card-spotlight {
  position: relative;
  border-radius: 1.5rem;
  border: 1px solid #222;
  background-color: #111;
  padding: 2rem;
  overflow: hidden;
  --mouse-x: 50%;
  --mouse-y: 50%;
  --spotlight-color: rgba(255, 255, 255, 0.05);
}

.card-spotlight::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), var(--spotlight-color), transparent 80%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

.card-spotlight:hover::before,
.card-spotlight:focus-within::before {
  opacity: 0.6;
}

</style>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.0.0","react/jsx-runtime":"https://esm.sh/react@19.0.0/jsx-runtime","react-dom":"https://esm.sh/react-dom@19.0.0","react-dom/client":"https://esm.sh/react-dom@19.0.0/client","motion/react":"https://esm.sh/motion@12.23.12/react?external=react,react-dom","gsap":"https://esm.sh/gsap@3.13.0","gsap/":"https://esm.sh/gsap@3.13.0/","@gsap/react":"https://esm.sh/@gsap/react@2.1.2?external=gsap,react","ogl":"https://esm.sh/ogl@1.0.11","three":"https://esm.sh/three@0.180.0","three/":"https://esm.sh/three@0.180.0/","@react-three/fiber":"https://esm.sh/@react-three/fiber@9.3.0?external=react,react-dom,three","@react-three/drei":"https://esm.sh/@react-three/drei@10.7.4?external=react,three,@react-three/fiber","@react-three/postprocessing":"https://esm.sh/@react-three/postprocessing@3.0.4?external=react,three,@react-three/fiber,postprocessing","@react-three/rapier":"https://esm.sh/@react-three/rapier@2.1.0?external=react,three,@react-three/fiber","postprocessing":"https://esm.sh/postprocessing@6.36.0?external=three","matter-js":"https://esm.sh/matter-js@0.20.0","react-icons/":"https://esm.sh/react-icons@5.5.0/","lucide-react":"https://esm.sh/lucide-react@0.542.0?external=react","lenis":"https://esm.sh/lenis@1.3.13","meshline":"https://esm.sh/meshline@3.3.1?external=three","gl-matrix":"https://esm.sh/gl-matrix@3.4.3","maath":"https://esm.sh/maath@0.10.8?external=three","@use-gesture/react":"https://esm.sh/@use-gesture/react@10.2.27?external=react","face-api.js":"https://esm.sh/face-api.js@0.22.2"}}</script>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading SpotlightCard...</div></div>
<script type="module">
import * as React from 'react';
import { useRef } from 'react';
const SpotlightCard = ({ children, className = '', spotlightColor = 'rgba(255, 255, 255, 0.25)' }) => {
    const divRef = useRef(null);
    const handleMouseMove = e => {
        const rect = divRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        divRef.current.style.setProperty('--mouse-x', `${x}px`);
        divRef.current.style.setProperty('--mouse-y', `${y}px`);
        divRef.current.style.setProperty('--spotlight-color', spotlightColor);
    };
    return (React.createElement("div", { ref: divRef, onMouseMove: handleMouseMove, className: `card-spotlight ${className}` }, children));
};
SpotlightCard;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(SpotlightCard, {
    spotlightColor: '#ffffff40'
}));

</script>
</body>
</html>
