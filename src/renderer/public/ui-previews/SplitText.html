<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:13px;">Loading SplitText...</div></div>
<script type="module">
import * as React from 'react';
import { useRef, useEffect, useState } from 'react';
import { gsap } from 'gsap';
import { ScrollTrigger } from 'gsap/ScrollTrigger';
import { SplitText as GSAPSplitText } from 'gsap/SplitText';
import { useGSAP } from '@gsap/react';
gsap.registerPlugin(ScrollTrigger, GSAPSplitText, useGSAP);
const SplitText = ({ text, className = '', delay = 50, duration = 1.25, ease = 'power3.out', splitType = 'chars', from = { opacity: 0, y: 40 }, to = { opacity: 1, y: 0 }, threshold = 0.1, rootMargin = '-100px', textAlign = 'center', tag = 'p', onLetterAnimationComplete }) => {
    const ref = useRef(null);
    const animationCompletedRef = useRef(false);
    const onCompleteRef = useRef(onLetterAnimationComplete);
    const [fontsLoaded, setFontsLoaded] = useState(false);
    // Keep callback ref updated
    useEffect(() => {
        onCompleteRef.current = onLetterAnimationComplete;
    }, [onLetterAnimationComplete]);
    useEffect(() => {
        if (document.fonts.status === 'loaded') {
            setFontsLoaded(true);
        }
        else {
            document.fonts.ready.then(() => {
                setFontsLoaded(true);
            });
        }
    }, []);
    useGSAP(() => {
        if (!ref.current || !text || !fontsLoaded)
            return;
        // Prevent re-animation if already completed
        if (animationCompletedRef.current)
            return;
        const el = ref.current;
        if (el._rbsplitInstance) {
            try {
                el._rbsplitInstance.revert();
            }
            catch (_) {
                /* noop */
            }
            el._rbsplitInstance = null;
        }
        const startPct = (1 - threshold) * 100;
        const marginMatch = /^(-?\d+(?:\.\d+)?)(px|em|rem|%)?$/.exec(rootMargin);
        const marginValue = marginMatch ? parseFloat(marginMatch[1]) : 0;
        const marginUnit = marginMatch ? marginMatch[2] || 'px' : 'px';
        const sign = marginValue === 0
            ? ''
            : marginValue < 0
                ? `-=${Math.abs(marginValue)}${marginUnit}`
                : `+=${marginValue}${marginUnit}`;
        const start = `top ${startPct}%${sign}`;
        let targets;
        const assignTargets = self => {
            if (splitType.includes('chars') && self.chars.length)
                targets = self.chars;
            if (!targets && splitType.includes('words') && self.words.length)
                targets = self.words;
            if (!targets && splitType.includes('lines') && self.lines.length)
                targets = self.lines;
            if (!targets)
                targets = self.chars || self.words || self.lines;
        };
        const splitInstance = new GSAPSplitText(el, {
            type: splitType,
            smartWrap: true,
            autoSplit: splitType === 'lines',
            linesClass: 'split-line',
            wordsClass: 'split-word',
            charsClass: 'split-char',
            reduceWhiteSpace: false,
            onSplit: self => {
                assignTargets(self);
                const tween = gsap.fromTo(targets, { ...from }, {
                    ...to,
                    duration,
                    ease,
                    stagger: delay / 1000,
                    scrollTrigger: {
                        trigger: el,
                        start,
                        once: true,
                        fastScrollEnd: true,
                        anticipatePin: 0.4
                    },
                    onComplete: () => {
                        animationCompletedRef.current = true;
                        onCompleteRef.current?.();
                    },
                    willChange: 'transform, opacity',
                    force3D: true
                });
                return tween;
            }
        });
        el._rbsplitInstance = splitInstance;
        return () => {
            ScrollTrigger.getAll().forEach(st => {
                if (st.trigger === el)
                    st.kill();
            });
            try {
                splitInstance.revert();
            }
            catch (_) {
                /* noop */
            }
            el._rbsplitInstance = null;
        };
    }, {
        dependencies: [
            text,
            delay,
            duration,
            ease,
            splitType,
            JSON.stringify(from),
            JSON.stringify(to),
            threshold,
            rootMargin,
            fontsLoaded
        ],
        scope: ref
    });
    const renderTag = () => {
        const style = {
            textAlign,
            overflow: 'hidden',
            display: 'inline-block',
            whiteSpace: 'normal',
            wordWrap: 'break-word',
            willChange: 'transform, opacity'
        };
        const classes = `split-parent ${className}`;
        const Tag = tag || 'p';
        return (React.createElement(Tag, { ref: ref, style: style, className: classes }, text));
    };
    return renderTag();
};
SplitText;
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(React.createElement(SplitText, {
    text: 'Hello, you!',
    delay: 50,
    duration: 1.25,
    ease: 'power3.out',
    splitType: 'chars',
    showCallback: true
}));

</script>
</body>
